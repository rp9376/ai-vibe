# Claude Code — the primary agent (SPEC AGT-2). Field reference: SPEC AGT-1.
# Non-essential traffic is switched off in rootfs/etc/claude-code/managed-settings.json (root-owned).
# Verified switches for 2.1.328 (SPEC §14 E-7); re-verify after `vibe build --fresh` brings a new version.
AGENT_ENABLED=yes
#AGENT_VERSION=2.1.328                    # last verified pin (SPEC §14 E-7); uncomment (and comment the next line) to pin
AGENT_VERSION=latest                     # newest at build time; a plain `vibe build` reuses the cached layer, `vibe build --fresh` fetches the newest
AGENT_CLOUD=yes                          # needs cloud egress; state is NOT mounted under local/offline
AGENT_STATE="claude:/home/user/.claude"  # <dir under ~/.vibe/state>:<path in container>, space-separated
AGENT_ENV="CLAUDE_CONFIG_DIR=/home/user/.claude DISABLE_AUTOUPDATER=1"
AGENT_EXTENSIONS="anthropic.claude-code"
AGENT_INSTRUCTIONS="/etc/claude-code/CLAUDE.md"  # build copies image/AGENTS.md here (Claude's managed instructions)
AGENT_CHECK="claude --version"
