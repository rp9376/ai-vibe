# opencode — the local-model-only agent for sensitive data (SPEC AGT-4). Field reference: SPEC AGT-1.
# Walls: /etc/opencode/opencode.json (managed, root-owned) allows only the provider named "local";
# the wrapper installed by install.sh refuses to start outside the 'local'/'offline' network profiles.
# You define "local" (endpoint + models) in ~/.vibe/state/opencode/config/opencode.json.
AGENT_ENABLED=yes
AGENT_VERSION=latest
AGENT_CLOUD=no                           # stays mounted under local/offline
AGENT_STATE="opencode/config:/home/user/.config/opencode opencode/data:/home/user/.local/share/opencode"
AGENT_ENV="OPENCODE_DISABLE_MODELS_FETCH=1 OPENCODE_DISABLE_AUTOUPDATE=1 OPENCODE_DISABLE_CLAUDE_CODE=1"
AGENT_EXTENSIONS=""
AGENT_CHECK="opencode --version"
