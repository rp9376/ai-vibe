# opencode (V2, npm @opencode/cli) — the local-model-only agent for sensitive data (SPEC AGT-4).
# Field reference: SPEC AGT-1. Walls:
#   - /etc/opencode/opencode.json (managed, root-owned): only the provider named "local" is enabled
#   - install.sh wraps `opencode`/`opencode2`: refuses to start outside the 'local'/'offline' profiles
#   - AGENT_ENV: no model catalog fetch, no free cloud models, no self-update, no reading ~/.claude
# You define "local" (endpoint + models) in ~/.vibe/state/opencode/config/opencode.jsonc.
# Verified switches for 2.3.2 (SPEC §14 E-6); re-verify after `vibe build --fresh` brings a new version.
AGENT_ENABLED=yes
#AGENT_VERSION=2.3.2                    # last verified pin (SPEC §14 E-6); uncomment (and comment the next line) to pin
AGENT_VERSION=latest                     # newest at build time; a plain `vibe build` reuses the cached layer, `vibe build --fresh` fetches the newest
AGENT_CLOUD=no                           # stays mounted under local/offline
AGENT_STATE="opencode/config:/home/user/.config/opencode opencode/data:/home/user/.local/share/opencode"
AGENT_ENV="OPENCODE_DISABLE_MODELS_FETCH=1 OPENCODE_DISABLE_FREE_MODELS=1 OPENCODE_DISABLE_AUTOUPDATE=1 OPENCODE_DISABLE_CLAUDE_CODE=1"
AGENT_EXTENSIONS=""
AGENT_CHECK="opencode --version"
