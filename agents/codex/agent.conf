# OpenAI Codex CLI (SPEC AGT-3). Field reference: SPEC AGT-1.
# Analytics are switched off in rootfs/etc/codex/managed_config.toml (root-owned, overrides user config).
# Verified for 0.170.0 (SPEC §14 E-7); re-verify after `vibe build --fresh` brings a new version.
AGENT_ENABLED=yes
#AGENT_VERSION=0.170.0                    # last verified pin (SPEC §14 E-7); uncomment (and comment the next line) to pin
AGENT_VERSION=latest                     # newest at build time; a plain `vibe build` reuses the cached layer, `vibe build --fresh` fetches the newest
AGENT_CLOUD=yes
AGENT_STATE="codex:/home/user/.codex"
AGENT_ENV="CODEX_HOME=/home/user/.codex"
AGENT_EXTENSIONS="openai.chatgpt"
AGENT_CHECK="codex --version"
