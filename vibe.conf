# vibe.conf — shared defaults (committed). Personal overrides go in ~/.vibe/config (same syntax).
# Plain shell assignments, read by the `vibe` CLI on the host. See SPEC.md CLI-4.

# --- image ---------------------------------------------------------------
VIBE_IMAGE=vibe:latest
VIBE_PROXY_IMAGE=vibe-proxy:latest
VIBE_BASE_IMAGE=ubuntu:22.04     # swap for your toolchain image (Debian/Ubuntu family), then: vibe build && vibe doctor
VIBE_NODE_MAJOR=24               # Node.js major to install; empty = use the base image's node

# --- runtime -------------------------------------------------------------
VIBE_NET=agents                  # default network profile: agents | local | offline | open | net/profiles/<name>.txt
VIBE_CPUS=4                      # clamped to the host's CPU count
VIBE_MEMORY=8g
VIBE_PIDS=4096

# --- editor --------------------------------------------------------------
VIBE_EXTENSIONS=""               # extra VS Code extensions for every container (agents add their own)

# --- workspace guard (SPEC WS-2) -------------------------------------------
# Files/dirs the HOST may execute; `vibe audit` and `vibe down` report changes to them.
VIBE_TRUST_PATHS=".devcontainer .devcontainer.json .vscode .envrc .git/config .git/hooks .gitattributes .gitmodules mise.toml .mise.toml .tool-versions"
