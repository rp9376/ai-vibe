# Allowlist proxy for one vibe project. Default deny; allowed hosts are anchored regexes
# generated by `vibe` from net/profiles + agents/*/domains.txt + your ~/.vibe lists.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
PidFile "/tmp/tinyproxy.pid"
LogLevel Notice
DisableViaHeader Yes

# FilterURLs: rules see "host:port" for HTTPS (CONNECT) and "http://host:port/..." for plain HTTP,
# so every allowed entry is pinned to its port (443 unless the entry names one). See to_regex in vibe.
Filter "/etc/vibe/allow.regex"
FilterType ere
FilterURLs On
FilterDefaultDeny Yes
